  <path d="M0 150 Q180 90 360 140 T720 120 T1080 135 T1440 105 V240 H0Z" fill="#0f4a3a" opacity=".55"/>
  <path d="M0 185 Q240 140 480 175 T960 160 T1440 170 V240 H0Z" fill="#0b3329"/>
