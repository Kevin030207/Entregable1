<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .nodo{animation:pulso 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .nodo:nth-of-type(2n){animation-delay:1s}.nodo:nth-of-type(3n){animation-delay:2s}
    @keyframes pulso{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
  </style>
  <defs>
